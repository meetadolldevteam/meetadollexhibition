kind = "web"
previewPath = "/"
title = "Meetadoll Exhibition"
version = "1.0.0"
id = "artifacts/meetadoll-exhibition"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26077

[services.development]
run = "pnpm --filter @workspace/meetadoll-exhibition run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meetadoll-exhibition", "run", "build" ]
publicDir = "artifacts/meetadoll-exhibition/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26077"
BASE_PATH = "/"
VITE_API_URL = "/api"
